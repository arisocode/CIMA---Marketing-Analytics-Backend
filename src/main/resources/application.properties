# Spring Boot application configuration
spring.application.name=crm-marketing
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:3003}

# Secreto perimetral compartido del API Gateway (ADR-003)
cimaxis.security.gateway-secret=${INTERNAL_GATEWAY_SECRET:}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:25432}/${DATABASE_NAME:crm_database}?currentSchema=${DB_SCHEMA:schema_marketing}
spring.datasource.username=${DATABASE_USER:marketing_user}
spring.datasource.password=${DATABASE_PASSWORD:marketingpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (FIND-DB-01)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:6}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CRM base URL for client and project sync
crm.base.url=${CRM_BASE_URL:http://localhost:28080}

# Planificar workflows
cimaxis.scheduler.enabled=true
cimaxis.scheduler.cron=0 0 * * * *
cimaxis.scheduler.default-no-contact-days=15
# Reintentos de entrega: no reenvia ejecuciones exitosas y limita los fallos.
cimaxis.scheduler.retry-delay-minutes=60
cimaxis.scheduler.max-delivery-attempts=3

# Consolidacion automatica de KPIs
cimaxis.kpi.cron=0 30 1 * * *

# Envio de correo desacoplado via crm-media (ADR-004)
cimaxis.mail.enabled=false
cimaxis.mail.media-service-url=${MEDIA_SERVICE_URL:http://crm-media:3002}
cimaxis.mail.from=no-reply@cima.com.co
cimaxis.mail.subject-prefix=[CIMA]

# Destinatario operativo de las alertas de workflows notify_admin. Debe ser un
# buzón o lista de distribución administrada fuera del servicio; Marketing no
# consulta usuarios ni esquemas de otros módulos para resolverlo.
cimaxis.notifications.admin-recipient=${ADMIN_NOTIFICATION_RECIPIENT:}


# Sincronizacion de clientes y proyectos desde el CRM
cimaxis.crm.sync.enabled=true

# Sincroniza al arrancar la aplicacion. Si el CRM no responde,
# la app arranca igual y solo deja una advertencia en el log.
cimaxis.crm.sync.on-startup=true

# Sincronizacion periodica: cada 6 horas
cimaxis.crm.sync.cron=0 0 */6 * * *

# Proyección local de proyectos de Collab. La lectura de Analytics nunca
# consulta el esquema de otro microservicio.
spring.data.redis.url=${REDIS_URL:redis://localhost:26379}
cimaxis.collab-projection.enabled=${COLLAB_PROJECTION_ENABLED:true}
cimaxis.collab-projection.stream=${COLLAB_EVENTS_STREAM:stream:collab.events}
cimaxis.collab-projection.dlq-stream=${COLLAB_EVENTS_DLQ_STREAM:stream:collab.events-dlq}
cimaxis.collab-projection.consumer-group=${COLLAB_PROJECTION_CONSUMER_GROUP:group:marketing.collab-events}
cimaxis.collab-projection.consumer-name=${COLLAB_PROJECTION_CONSUMER_NAME:${HOSTNAME:marketing}-projects}
cimaxis.collab-projection.batch-size=${COLLAB_PROJECTION_BATCH_SIZE:50}
cimaxis.collab-projection.max-retries=${COLLAB_EVENTS_MAX_RETRIES:3}
cimaxis.collab-projection.poll-delay-ms=${COLLAB_PROJECTION_POLL_DELAY_MS:1000}

# La cuenta de servicio para autenticarse contra el CRM se define
# en application-local.properties (desarrollo) o por variables de
# entorno en despliegue.
