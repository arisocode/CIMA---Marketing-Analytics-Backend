# Spring Boot application configuration
spring.application.name=crm-marketing
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:3003}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:15432}/${DATABASE_NAME:crm_database}?currentSchema=${DB_SCHEMA:schema_marketing}
spring.datasource.username=${DATABASE_USER:marketing_user}
spring.datasource.password=${DATABASE_PASSWORD:marketingpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CRM base URL for client and project sync
crm.base.url=${CRM_BASE_URL:http://localhost:18080}

# Planificar workflows
cimaxis.scheduler.enabled=true
cimaxis.scheduler.cron=0 0 * * * *
cimaxis.scheduler.default-no-contact-days=15
# Reintentos de entrega: no reenvia ejecuciones exitosas y limita los fallos.
cimaxis.scheduler.retry-delay-minutes=60
cimaxis.scheduler.max-delivery-attempts=3

# Consolidacion automatica de KPIs
cimaxis.kpi.cron=0 30 1 * * *

# Envio de correo
cimaxis.mail.enabled=false
cimaxis.mail.from=no-reply@cima.com.co
cimaxis.mail.subject-prefix=[CIMA]

# cimaxis.mail.enabled=true
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USER}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Sincronizacion de clientes y proyectos desde el CRM
cimaxis.crm.sync.enabled=true

# Sincroniza al arrancar la aplicacion. Si el CRM no responde,
# la app arranca igual y solo deja una advertencia en el log.
cimaxis.crm.sync.on-startup=true

# Sincronizacion periodica: cada 6 horas
cimaxis.crm.sync.cron=0 0 */6 * * *

# La cuenta de servicio para autenticarse contra el CRM se define
# en application-local.properties (desarrollo) o por variables de
# entorno en despliegue.
